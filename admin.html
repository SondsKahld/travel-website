<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الإدارية - عالم الرحلات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background-color: #f4f7f6; color: #333; }
        .admin-header { background-color: #1d3557; color: white; padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
        .admin-header h1 { font-size: 24px; }
        .admin-actions { display: flex; gap: 15px; align-items: center; }
        .admin-header a, .btn-logout { color: white; text-decoration: none; background: #0077b6; padding: 8px 15px; border-radius: 5px; font-size: 14px; border: none; cursor: pointer; }
        .btn-logout { background-color: #e63946; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        
        /* إحصائيات سريعة */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: space-between; }
        .stat-info h3 { font-size: 14px; color: #777; margin-bottom: 5px; }
        .stat-info p { font-size: 24px; font-weight: 700; color: #1d3557; }
        .stat-icon { font-size: 40px; color: #0077b6; background: #e0f2fe; padding: 15px; border-radius: 10px; }

        .card-table { background: white; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); overflow: hidden; padding: 20px; }
        .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .table-header h2 { color: #1d3557; }
        .search-input { padding: 10px; width: 300px; border: 1px solid #ddd; border-radius: 6px; outline: none; }

        table { width: 100%; border-collapse: collapse; text-align: right; }
        th, td { padding: 15px; border-bottom: 1px solid #eee; }
        th { background-color: #f8f9fa; color: #1d3557; font-weight: 700; }
        tr:hover { background-color: #f9f9f9; }
        .btn-delete { background-color: #e63946; color: white; border: none; padding: 6px 12px; border-radius: 5px; cursor: pointer; transition: background 0.3s; }
        .btn-delete:hover { background-color: #d90429; }
        .no-data { text-align: center; padding: 30px; color: #777; }
    </style>
</head>
<body>

    <header class="admin-header">
        <h1><i class="fa-solid fa-gauge-high"></i> لوحة التحكم الإدارية</h1>
        <div class="admin-actions">
            <a href="t.html"><i class="fa-solid fa-house"></i> العودة للموقع</a>
            <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج</button>
        </div>
    </header>

    <div class="container">
        <!-- مربعات الإحصائيات -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-info">
                    <h3>إجمالي الحجوزات</h3>
                    <p id="totalBookings">0</p>
                </div>
                <i class="fa-solid fa-bookmark stat-icon"></i>
            </div>
        </div>

        <div class="card-table">
            <div class="table-header">
                <h2>إدارة الحجوزات الواردة</h2>
                <input type="text" id="searchInput" class="search-input" placeholder="ابحث باسم العميل أو الوجهة..." onkeyup="filterBookings()">
            </div>
            <table>
                <thead>
                    <tr>
                        <th>رقم الحجز (ID)</th>
                        <th>اسم العميل</th>
                        <th>رقم الهاتف</th>
                        <th>الوجهة السياحية</th>
                        <th>تاريخ ووقت الحجز</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="bookingsTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        // التحقق من تسجيل الدخول
        if (localStorage.getItem('isAdminLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }

        let allBookings = [];

        async function fetchBookings() {
            try {
                const response = await fetch('http://localhost:3000/api/bookings');
                const data = await response.json();

                if (data.success) {
                    allBookings = data.bookings;
                    displayBookings(allBookings);
                    document.getElementById('totalBookings').innerText = allBookings.length;
                }
            } catch (error) {
                console.error('خطأ:', error);
                document.getElementById('bookingsTableBody').innerHTML = `<tr><td colspan="6" class="no-data" style="color:red;">تعذر الاتصال بالخادم.</td></tr>`;
            }
        }

        function displayBookings(bookings) {
            const tbody = document.getElementById('bookingsTableBody');
            tbody.innerHTML = '';

            if (bookings.length > 0) {
                bookings.forEach(booking => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>#${booking.id}</td>
                        <td>${booking.clientName}</td>
                        <td>${booking.clientPhone}</td>
                        <td>${booking.destination}</td>
                        <td>${booking.createdAt}</td>
                        <td>
                            <button class="btn-delete" onclick="deleteBooking(${booking.id})">
                                <i class="fa-solid fa-trash"></i> حذف
                            </button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } else {
                tbody.innerHTML = `<tr><td colspan="6" class="no-data">لا توجد حجوزات مطابقة.</td></tr>`;
            }
        }

        // البحث المباشر
        function filterBookings() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allBookings.filter(b => 
                b.clientName.toLowerCase().includes(searchText) || 
                b.destination.toLowerCase().includes(searchText)
            );
            displayBookings(filtered);
        }

        // حذف حجز مع تأكيد أنيق
        async function deleteBooking(id) {
            Swal.fire({
                title: 'هل أنت متأكد؟',
                text: "لن يمكنك استعادة هذا الحجز بعد deletions!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#e63946',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'نعم، احذفه!',
                cancelButtonText: 'إلغاء'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    try {
                        const response = await fetch(`http://localhost:3000/api/book/${id}`, { method: 'DELETE' });
                        const data = await response.json();
                        if (data.success) {
                            Swal.fire('تم الحذف!', 'تم حذف الحجز بنجاح.', 'success');
                            fetchBookings();
                        } else {
                            Swal.fire('خطأ!', 'فشل في حذف الحجز.', 'error');
                        }
                    } catch (error) {
                        Swal.fire('خطأ!', 'حدث خطأ أثناء الاتصال بالخادم.', 'error');
                    }
                }
            });
        }

        function logout() {
            localStorage.removeItem('isAdminLoggedIn');
            window.location.href = 'login.html';
        }

        window.onload = fetchBookings;
    </script>
</body>
</html>
